[package]
name = "voidb-plugin-redis"
version = "0.3.5"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for Redis"
repository = "https://github.com/limmytian/voidb-plugin-redis"

[[bin]]
name = "voidb-plugin-redis"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", rev = "95880c66ac7cfa71b33ad241f5fe4890130ab65a" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", rev = "95880c66ac7cfa71b33ad241f5fe4890130ab65a" }
redis = { version = "0.27", features = ["tokio-comp", "aio", "streams"] }
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
toml = "0.8"
